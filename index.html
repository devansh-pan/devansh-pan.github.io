<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Core -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG to Webp  | Devansh</title>
    <meta name="description" content="PNG to webp converter and transformer">

    <!-- Social -->
    <meta property="og:title" content="PNG to webp">
    <meta property="og:image" content="https://example.com/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
<meta name="fevicon" content="/fevicon.png">
    <!-- Canonical -->
    <link rel="canonical" href="https://devansh-pan.github.io">

    <!-- Mobile -->
    <meta name="theme-color" content="#2d89ef">

</head>
<body>
    <header><h1>PNG to WebP </h1></header>
    <p>Input PNG image to convert</p>
    <input type="file" id="fileInput" accept="image/png" />
    <input type="range" id="qlty" min="0.1" max="1" step="0.1" value="0.8" onchange="change(this.value)" />
   <p id="demo">{qlty}</p>
    <a id="downloadLink" style="display: none;">Download WebP</a>

    <script>
        const fileInput = document.getElementById('fileInput');
        const downloadLink = document.getElementById('downloadLink');
        const qlty = document.getElementById('qlty').value;
      const demo =  document.getElementById("demo") ;
        demo.textContent = qlty;
function change(value) {
    qlty = value;
    demo.textContent = qlty ;
}
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                // Load the image
                const img = await loadImage(file);
                
                // Convert to WebP
                const webpBlob = await convertToWebP(img);
                
                // Create download link
                const url = URL.createObjectURL(webpBlob);
                downloadLink.href = url;
                downloadLink.download = 'converted_image.webp';
                downloadLink.style.display = 'inline';
            } catch (error) {
                console.error('Conversion error:', error);
                alert('Error converting image: ' + error.message);
            }
        });

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();

                reader.onload = (e) => {
                    img.src = e.target.result;
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function convertToWebP(img, quality = qlty || 0.8) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = img.width;
                canvas.height = img.height;
                
                ctx.drawImage(img, 0, 0);
                
                canvas.toBlob(
                    (blob) => blob ? resolve(blob) : reject(new Error('Conversion failed')),
                    'image/webp',
                    quality
                );
            });
        }
    </script>
</body>
</html>
