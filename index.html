<!DOCTYPE html>
<html>
<head>
    <title>PNG to WebP Converter</title>
</head>
<body>
    <input type="file" id="fileInput" accept="image/png" />
    <a id="downloadLink" style="display: none;">Download WebP</a>

    <script>
        const fileInput = document.getElementById('fileInput');
        const downloadLink = document.getElementById('downloadLink');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                // Load the image
                const img = await loadImage(file);
                
                // Convert to WebP
                const webpBlob = await convertToWebP(img);
                
                // Create download link
                const url = URL.createObjectURL(webpBlob);
                downloadLink.href = url;
                downloadLink.download = 'converted_image.webp';
                downloadLink.style.display = 'inline';
            } catch (error) {
                console.error('Conversion error:', error);
                alert('Error converting image: ' + error.message);
            }
        });

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();

                reader.onload = (e) => {
                    img.src = e.target.result;
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function convertToWebP(img, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = img.width;
                canvas.height = img.height;
                
                ctx.drawImage(img, 0, 0);
                
                canvas.toBlob(
                    (blob) => blob ? resolve(blob) : reject(new Error('Conversion failed')),
                    'image/webp',
                    quality
                );
            });
        }
    </script>
</body>
</html>
